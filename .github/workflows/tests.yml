name: Submission reproduction
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify and extract source distribution
        run: |
          sha256sum -c ARCHIVE_SHA256SUMS
          python -m zipfile -e active-information-engine-v1.0.0-submission.zip _reproduction
          python _reproduction/active-information-engine/scripts/verify_integrity.py
      - name: Install pinned runtime dependencies
        run: python -m pip install -r _reproduction/active-information-engine/requirements.txt
      - name: Tests, SM benchmarks, quick figures and audit
        run: python _reproduction/active-information-engine/run_all.py --workers 2
